name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve dependency metadata
        run: |
          go mod tidy
          echo AP_CODEBASE_GENERATED_GO_MOD_BEGIN
          cat go.mod
          echo AP_CODEBASE_GENERATED_GO_MOD_END
          echo AP_CODEBASE_GENERATED_GO_SUM_BEGIN
          cat go.sum
          echo AP_CODEBASE_GENERATED_GO_SUM_END
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
